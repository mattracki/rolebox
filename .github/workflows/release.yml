name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run dist:mac:arm64
      - run: npm run dist:mac:x64

      - name: Package desktop apps
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/Rolebox-darwin-arm64/Rolebox.app" \
            "Rolebox-macOS-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/Rolebox-darwin-x64/Rolebox.app" \
            "Rolebox-macOS-x64.zip"

      - name: Create source archive
        run: |
          git archive --format=tar.gz \
            --prefix="rolebox-${GITHUB_REF_NAME#v}/" \
            -o "rolebox-${GITHUB_REF_NAME#v}.tar.gz" \
            "$GITHUB_REF_NAME"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "Rolebox-macOS-arm64.zip" \
            "Rolebox-macOS-x64.zip" \
            "rolebox-${GITHUB_REF_NAME#v}.tar.gz" \
            --generate-notes
